version: 1
name: gimp-mcp
description: Fork workspace for GIMP MCP Pro with uv tooling, typed config, CLI, and GIMP 3.2.4 verification work.
defaultTrack: dev
agent:
  notes: Use uv for all Python tooling. Prefer scripts/project.py or bridge.yml commands over direct tool invocations. .env is local-only; commit .env.example for documented defaults. Live GIMP checks can run either against an already-running plug-in bridge or by spawning a clean XDG profile with plug-in autostart.
  tasks:
    - Verify GIMP 3.2.4 compatibility against a live plugin instance.
    - Keep CLI, config, bridge and test tooling covered by pytest, ruff and mypy.
    - Use compat-live-spawn or compat-live-xvfb for self-contained live smoke runs that do not assume a pre-started plug-in server.
  changelog:
    - Added uv-centered project commands for sync/test/lint/format/typecheck/check.
    - Added typed pydantic-settings configuration and CLI diagnostics/repl commands.
    - Added clean-profile live smoke spawn commands for GIMP/Xvfb autostart verification.
commands:
  sync:
    run: ["uv", "sync", "--extra", "dev"]
    description: Install runtime and dev dependencies with uv.
    timeoutMs: 120000
    category: build
  test:
    run: ["uv", "run", "pytest"]
    description: Run the full pytest suite with coverage.
    timeoutMs: 120000
    category: test
  test-fast:
    run: ["uv", "run", "pytest", "--no-cov"]
    description: Run pytest without coverage for fast local loops.
    timeoutMs: 120000
    category: test
  test-cov:
    run: ["uv", "run", "pytest", "--cov-report=html", "--cov-report=term-missing:skip-covered"]
    description: Run pytest with terminal and HTML coverage reports.
    timeoutMs: 120000
    category: test
  lint:
    run: ["uv", "run", "ruff", "check", "."]
    description: Run ruff lint checks.
    timeoutMs: 120000
    category: lint
  lint-fix:
    run: ["uv", "run", "ruff", "check", "--fix", "."]
    description: Run ruff autofixes.
    timeoutMs: 120000
    category: lint
  format:
    run: ["uv", "run", "ruff", "format", "."]
    description: Format the project with ruff.
    timeoutMs: 120000
    category: format
  format-check:
    run: ["uv", "run", "ruff", "format", "--check", "."]
    description: Check formatting without modifying files.
    timeoutMs: 120000
    category: format
  typecheck:
    run: ["uv", "run", "mypy"]
    description: Run mypy type checks.
    timeoutMs: 120000
    category: test
  check:
    run: ["uv", "run", "python", "scripts/project.py", "check"]
    description: "Run the full quality gate: format-check, lint, typecheck, test."
    timeoutMs: 240000
    category: test
  cli-config:
    run: ["uv", "run", "gimp-mcp-pro", "config", "--json"]
    description: Print resolved CLI configuration.
    timeoutMs: 30000
    category: custom
  cli-doctor:
    run: ["uv", "run", "gimp-mcp-pro", "doctor"]
    description: Run CLI diagnostics without connecting to GIMP.
    timeoutMs: 30000
    category: custom
  install-plugin:
    run: ["uv", "run", "python", "scripts/install_gimp_plugin.py"]
    description: Deploy the bundled plug-in into the newest local GIMP profile and verify byte equality.
    timeoutMs: 30000
    category: custom
  docs-generate:
    run: ["uv", "run", "python", "scripts/docs.py", "generate"]
    description: Generate MkDocs Material pages from README, API modules, and nested MCP tool docstrings.
    timeoutMs: 30000
    category: custom
  docs-audit:
    run: ["uv", "run", "python", "scripts/docs.py", "audit"]
    description: Check that every MCP tool has a meaningful renderable docstring and typed signature.
    timeoutMs: 30000
    category: test
  docs-build:
    run: ["uv", "run", "--extra", "dev", "mkdocs", "build", "--strict"]
    description: Build the MkDocs Material documentation site in strict mode.
    timeoutMs: 120000
    category: build
  docs-serve:
    run: ["uv", "run", "--extra", "dev", "mkdocs", "serve"]
    description: Serve the MkDocs Material documentation site locally.
    timeoutMs: 120000
    category: dev
  build-dist:
    run: ["uv", "build", "--sdist", "--wheel"]
    description: Build PyPI-compatible source and wheel distributions into dist/.
    timeoutMs: 120000
    category: build
  compat-list-tools:
    run: ["uv", "run", "python", "scripts/compat.py", "list-tools", "--grouped"]
    description: List source-derived MCP tool registry grouped by module.
    timeoutMs: 30000
    category: custom
  compat-validate:
    run: ["uv", "run", "python", "scripts/compat.py", "validate"]
    description: Validate compat.yml against source-derived compatibility facts.
    timeoutMs: 30000
    category: test
  compat-audit:
    run: ["uv", "run", "python", "scripts/compat.py", "audit"]
    description: Audit the GIMP 3.2.4 public compatibility claim gate.
    timeoutMs: 30000
    category: test
  compat-validate-results:
    run: ["uv", "run", "python", "scripts/compat.py", "validate-results", "compat.results.yml"]
    description: Validate a compat.results.yml evidence file without granting the public claim gate.
    timeoutMs: 30000
    category: test
  compat-template:
    run: ["uv", "run", "python", "scripts/compat.py", "init-results", "--output", "compat.results.template.yml", "--force"]
    description: Generate a non-claiming compat.results.yml template.
    timeoutMs: 30000
    category: custom
  compat-live-smoke:
    run: ["uv", "run", "python", "tests/live_gimp_324_smoke.py", "--output", "compat.results.yml"]
    description: Run partial live checks against an already-running GIMP plug-in bridge; use compat-live-xvfb for the full claim gate.
    timeoutMs: 120000
    category: test
  compat-live-spawn:
    run: ["uv", "run", "python", "tests/live_gimp_324_smoke.py", "--spawn", "--xvfb", "--include-static-checks", "--output", "compat.results.yml"]
    description: Spawn a clean-profile GIMP instance under xvfb-run -a, autostart the plug-in bridge, run the live compat matrix and static claim gate, then stop GIMP.
    timeoutMs: 180000
    category: test
  compat-live-xvfb:
    run: ["uv", "run", "python", "tests/live_gimp_324_smoke.py", "--spawn", "--xvfb", "--include-static-checks", "--output", "compat.results.yml"]
    description: Run the self-contained clean-profile live compat matrix and static claim gate under xvfb-run -a for headless environments.
    timeoutMs: 180000
    category: test
  gimp-clean-profile:
    run: ["scripts/gimp-clean-profile.sh"]
    description: Prepare a clean XDG GIMP profile with the bundled MCP plug-in installed and autostart enabled.
    timeoutMs: 30000
    category: custom
