gimp_3_2_4_context:
  release_date: 2026-04-19
  relevant_release_notes:
  - 3.2.4 is the second update of the 3.2 series with bugfixes and UX updates.
  - Release notes mention fixes preventing accidental rasterization of link, text,
    and vector layers in several operations.
  - The GimpUnit API pixel-unit issue was fixed; tools touching font size or line
    width should be verified.
  - Official Script-Fu functions such as gimp-drawable-brightness-contrast and gimp-drawable-threshold
    were converted toward GEGL/new-filter APIs.
  references:
  - https://www.gimp.org/news/2026/04/19/gimp-3-2-4-released/
  - https://developer.gimp.org/resource/writing-a-plug-in/tutorial-python/
common_findings:
- All registered MCP tool callbacks are async def and go through the AsyncToolBridge
  protocol.
- Most tools still generate Python source strings executed inside GIMP; fast tests
  now cover quoting/normalisation and success/failure result shapes, but live per-pixel
  assertions should continue to expand.
- The verified live path uses a clean XDG profile, persistent plug-in procedure startup,
  and Xvfb for spawned GIMP runs.
- The async-native bridge is covered by C-025-async-transport and dedicated unit tests
  for framing, concurrent commands, and stream cleanup.
- Future tool candidates should stay in features.yml until implemented; compat.yml
  remains the contract for the verified 84-tool runtime registry.
