gimp_3_2_4_context:
  release_date: 2026-04-19
  relevant_release_notes:
    - '3.2.4 is the second update of the 3.2 series with bugfixes and UX updates.'
    - 'Release notes mention fixes preventing accidental rasterization of link, text, and vector layers in several operations.'
    - 'The GimpUnit API pixel-unit issue was fixed; tools touching font size or line width should be verified.'
    - 'Official Script-Fu functions such as gimp-drawable-brightness-contrast and gimp-drawable-threshold were converted toward GEGL/new-filter APIs.'
  references:
    - https://www.gimp.org/news/2026/04/19/gimp-3-2-4-released/
    - https://developer.gimp.org/resource/writing-a-plug-in/tutorial-python/

common_findings:
  - 'All registered MCP tool callbacks are synchronous def functions; none are async def.'
  - 'Most tools generate Python source strings and execute them inside GIMP via bridge.execute_python; this is powerful but brittle for quoting, static checking, and API drift.'
  - 'Layer-name/text/font string interpolation should be replaced with repr/json escaping before any live 3.2.4 push.'
  - 'The plugin handles each client on a background thread and calls GIMP APIs from that thread; this should be checked for main-thread safety under GIMP/GTK.'
  - 'The bridge serializes commands with a threading.Lock and persistent socket; first async path can be anyio.to_thread, followed by a real AsyncGimpBridge using asyncio streams.'

