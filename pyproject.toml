[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gimp-mcp-pro"
version = "0.2.0"
description = "Production-grade MCP server for GIMP 3.0+ — typed tools, reliable communication, AI-friendly workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "GIMP MCP Pro Contributors" },
]
keywords = ["gimp", "mcp", "image-editing", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "PyYAML>=6.0",
    "types-PyYAML>=6.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
gimp-mcp-pro = "gimp_mcp_pro.cli:main"
gimp-mcp-pro-server = "gimp_mcp_pro.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gimp_mcp_pro"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "site",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG"]
ignore = [
    "E501",   # line length is enforced by formatter where practical
    "ARG001", # MCP/register callback signatures intentionally accept injected args
    "ARG002", # compatibility signatures keep unused arguments explicit
    "B904",   # existing command wrappers preserve original traceback behavior for now
    "N806",   # GIMP/PyGObject naming uses capitalized module handles
    "N818",   # existing exception names keep project terminology
    "UP006",  # built-in generic migration can happen in a later compatibility pass
    "UP007",  # Optional-to-union migration can happen in a later compatibility pass
    "UP045",  # Optional-to-| migration can happen in a later compatibility pass
    "PT011",  # existing tests sometimes use broad validation exceptions intentionally
]

[tool.ruff.lint.per-file-ignores]
"gimp_plugin/gimp_mcp_plugin.py" = [
    "E402",  # gi.require_version must run before gi.repository imports
    "E722",  # GIMP cleanup paths deliberately catch broad PyGObject failures
    "I001",  # import ordering is constrained by gi.require_version
    "N802",  # gettext-style N_ helper is conventional in GIMP plug-ins
    "SIM105", # keep explicit try/except cleanup blocks in the plug-in
    "UP009", # keep encoding declaration for direct GIMP plug-in execution
    "UP041", # keep socket.timeout explicit in socket protocol code
]

[tool.ruff.lint.isort]
known-first-party = ["gimp_mcp_pro", "scripts", "tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["gimp_mcp_pro"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
exclude = [
    "^gimp_plugin/",
    "^tests/",
    "^scripts/",
]

[[tool.mypy.overrides]]
module = [
    "gimp_mcp_pro.tools.*",
    "gimp_mcp_pro.server",
]
disable_error_code = ["no-untyped-def", "no-any-return", "attr-defined", "operator", "union-attr", "arg-type", "assignment", "return-value", "valid-type", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=gimp_mcp_pro",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
markers = [
    "integration: requires a live GIMP plugin instance",
    "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = ["gimp_mcp_pro"]
omit = [
    "src/gimp_mcp_pro/prompts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 20
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
