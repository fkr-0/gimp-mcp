schema_version: 1
tool_group: color_tools
source_path: src/gimp_mcp_pro/tools/color_tools.py
source_lines: 1248
source_tool_count: 25
review_scope:
  focus:
  - design cohesion
  - generated-code implementation safety
  - test coverage depth
  - lifecycle and resource cleanup
  method: static source inspection plus test-reference inventory and focused pytest verification
  limitations:
  - No live GIMP smoke was run for this review; generated-code tests exercise offline bridge behavior only.
summary:
  overall_risk: medium
  strong_points:
  - All 25 color tools have at least test references; several high-risk paths have direct generated-code tests.
  - set_paint_context validates brush/pattern/gradient before mutation, records previous context, rolls back on
    failure, and releases temporary colors.
  - color_to_alpha has direct DrawableFilter lifecycle cleanup assertions for df/cfg deletion and gc.collect().
  - sampling and palette-analysis helpers use generated code with deterministic JSON payloads and bounded palette
    max_colors.
  primary_concerns:
  - The module still aggregates pixel adjustment, paint resources, sampling, palette analysis, and native backend
    delegation, though generated-code helpers are split into color_backend.py.
  - Most mutating pixel-adjustment tools do not have explicit generated-code undo-group/rollback lifecycle assertions.
  - sample_pixels permits arbitrarily large grid rows*columns and an uncapped average_radius, so generated-code
    work and response size can grow without a local safety limit.
  completed_fixes:
  - src/gimp_mcp_pro/tools/color_backend.py
  - src/gimp_mcp_pro/tools/color_backend.py extracts generated-code helpers and resource/sampling support from color_tools.py
  - Mutating color adjustment tools now emit __gimp_mcp_color_adjustment_lifecycle__ with image.undo_group_start/end
    in finally
  - sample_pixels now rejects requests above MAX_SAMPLE_POINTS before bridge calls
  - sample_pixels now rejects average_radius above MAX_AVERAGE_RADIUS before bridge calls
  - tests/test_color_lifecycle_tools.py now parameterizes the shared lifecycle policy across mutating adjustment
    tools
findings:
- id: COLOR-DESIGN-001
  severity: medium
  title: color_tools.py has become a mixed-responsibility mega-module
  evidence:
  - src/gimp_mcp_pro/tools/color_tools.py has 1,248 lines and 25 MCP handlers.
  - 'The module contains at least four distinct concerns: pixel adjustment handlers, paint-resource/context handlers,
    sampling/palette analysis, and promoted native palette backend delegation.'
  - _set_paint_context_code is 141 lines; _sample_pixels_code is 93 lines; _palette_analysis_code is 57 lines.
  impact: Changes to small color operations now require navigating unrelated generated-code helpers, which raises
    regression risk and weakens ownership boundaries.
  recommendation: 'Split by behavior rather than by historical roadmap: color_adjustment_tools or helper section,
    paint_context_tools, color_sampling_tools, and palette_tools/native delegation. Keep register_color_tools as
    an aggregator if API stability matters.'
  status: resolved
  completion_evidence:
  - Extracted generated-code helper responsibilities to src/gimp_mcp_pro/tools/color_backend.py.
  - Added structure guard ensuring color_tools.py no longer defines extracted helper functions and stays below 1250
    lines.
- id: COLOR-LIFECYCLE-001
  severity: high
  title: Mutating adjustment tools lack explicit undo/rollback lifecycle contract
  evidence:
  - Mutating adjustment handlers call generated GIMP operations after _color_preamble selection, but there is no
    shared undo-group wrapper in _color_preamble.
  - Direct lifecycle tests exist for set_paint_context and color_to_alpha, but the adjustment group is mostly covered
    through matrix/generated-code success paths.
  - Affected handlers include adjust_brightness_contrast, adjust_hue_saturation, adjust_color_balance, adjust_levels,
    adjust_curves, desaturate, invert_colors, apply_threshold, posterize, and auto_white_balance.
  impact: A failing generated mutation can leave partial document state changes with no asserted transaction boundary
    or rollback policy.
  recommendation: 'Define a single mutation lifecycle policy for adjustment tools: either explicit image.undo_group_start/end
    with finally cleanup, or document why GIMP plug-in invocation provides the atomic boundary. Add focused generated-code
    tests that assert the chosen policy.'
  status: resolved
  completion_evidence:
  - Added _color_adjustment_lifecycle helper with image.undo_group_start(), mutation try block, Gimp.displays_flush(),
    and image.undo_group_end() in finally.
  - Applied the lifecycle wrapper to ten mutating adjustment tools.
- id: COLOR-TEST-001
  severity: medium
  title: 'Coverage is broad but uneven: many tools are matrix-only or success-path-only'
  evidence:
  - All 25 tools have at least a test reference, but several core adjustment tools are covered only by test_tool_invocation_matrix.py
    and/or generic generated-code success tests.
  - Focused tests exist for color_to_alpha lifecycle, set_paint_context lifecycle, sample_pixels normal/empty cases,
    and resource inventory/context behavior.
  - There are no focused negative tests for unbounded sample_pixels grid dimensions or average_radius limits.
  impact: Generic success-path coverage protects registration and basic generated output, but misses lifecycle contracts
    and unsafe input boundaries.
  recommendation: Add focused tests for one representative mutation lifecycle wrapper, then parameterize over all
    mutating adjustment tools. Add negative tests for oversized sample_pixels grids and average radius bounds.
  status: resolved
  completion_evidence:
  - Added parameterized lifecycle tests for ten mutating adjustment tools.
  - Added negative before-bridge tests for oversized sample_pixels grids and excessive average_radius.
- id: COLOR-IMPLEMENTATION-001
  severity: medium
  title: sample_pixels generated work is not bounded by a local maximum
  evidence:
  - _normalise_sample_points validates grid rows/columns are >= 1 and width/height are non-negative, but does not
    cap rows*columns.
  - _sample_pixels_code emits nested loops using the requested rows and columns and appends one result per sample
    point.
  - average_radius is coerced to at least 0.0 but has no upper bound before being passed into image.pick_color.
  impact: A large grid can generate excessive GIMP work and large JSON payloads, creating latency and memory pressure
    from an otherwise read-only tool.
  recommendation: Introduce a MAX_SAMPLE_POINTS constant and a MAX_AVERAGE_RADIUS constant, reject oversized requests
    before bridge calls, and add tests proving rejection happens before generated code is executed.
  status: resolved
  completion_evidence:
  - Added MAX_SAMPLE_POINTS = 4096 and MAX_AVERAGE_RADIUS = 128.0.
  - _normalise_sample_points rejects oversized grids before code generation.
  - sample_pixels rejects excessive average_radius before bridge calls.
- id: COLOR-LIFECYCLE-002
  severity: low
  title: High-risk lifecycle paths have recently improved direct coverage
  evidence:
  - tests/test_color_lifecycle_tools.py asserts set_paint_context validation-before-mutation, rollback, temp color
    deletion, and gc.collect().
  - tests/test_color_resource_tools.py asserts color_to_alpha DrawableFilter lifecycle markers, df/cfg deletion,
    and gc.collect().
  impact: The two most obvious resource/context lifecycle paths are no longer only matrix-covered.
  recommendation: Keep these tests as templates for adjustment mutation lifecycle tests and any future DrawableFilter-based
    color operations.
  status: resolved
  completion_evidence:
  - Kept existing lifecycle coverage for set_paint_context and color_to_alpha as passing regression templates.
recommended_next_tests:
- id: COLOR-NEXT-001
  title: Reject oversized sample_pixels requests before bridge execution
  target: tests/test_sample_pixels_tools.py
  expected_red_first: A 10_000 x 10_000 grid currently reaches bridge code instead of failing locally.
- id: COLOR-NEXT-002
  title: Assert adjustment tools use a shared mutation lifecycle policy
  target: tests/test_color_lifecycle_tools.py
  expected_red_first: Current generated code does not include an explicit undo group or documented lifecycle marker
    for adjustment mutations.
- id: COLOR-NEXT-003
  title: Refactor color_tools into cohesive helper modules behind the existing register_color_tools API
  target: src/gimp_mcp_pro/tools/color_tools.py
  expected_red_first: A structure guard can require thin aggregator registration and forbid growth of generated
    helper blocks in the aggregator.
