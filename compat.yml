live_smoke_scenarios:
- id: C-000-spawn-gimp
  required: true
  title: Spawn clean-profile GIMP process
  steps:
  - Create or select an isolated GIMP profile directory.
  - Install the plug-in into the profile with a canonical GIMP 3.0 plug-ins layout.
  - Launch the selected GIMP 3.2.4 executable, optionally under Xvfb for CI/headless
    runs.
  assertions:
  - The spawned process PID, executable name, profile path, plug-in path and socket
    port are recorded.
  - The profile is clean or explicitly named as a test profile.
  - A failure to spawn is recorded as a compatibility failure, not as a verified claim.
- id: C-005-autostart-server
  required: true
  title: Plug-in autostart request before transport probe
  steps:
  - Request plug-in server autostart through the prepared profile/startup mechanism.
  - Wait for the bridge socket before running transport and API checks.
  assertions:
  - Autostart is either directly observed or covered by a successful C-020 transport
    connection.
  - If autostart is skipped, the result must explain which later check covers the
    same evidence.
- id: C-001-env-introspection
  required: true
  title: Record exact runtime environment
  steps:
  - Start GIMP 3.2.4 with clean profile.
  - Start plug-in from Tools -> Start MCP Pro Server.
  - Run get_gimp_info and execute_python introspection probes.
  assertions:
  - gimp application version is exactly 3.2.4 or build metadata clearly identifies
    3.2.4.
  - gi.require_version('Gimp', '3.0') succeeds.
  - libgimp library version reports or documents 3.2.4.
  - Python, PyGObject, GEGL and platform are recorded.
- id: C-010-plugin-registration
  required: true
  title: Plug-in discovery, PDB registration, menu activation
  probes:
  - Gimp.get_pdb().procedure_exists('plug-in-mcp-pro-server')
  - Gimp.get_pdb().lookup_procedure('plug-in-mcp-pro-server') is not None
  assertions:
  - PDB procedure exists after GIMP restart.
  - Menu item appears in Tools.
  - Starting twice does not spawn duplicate listeners and returns success/already-running
    gracefully.
- id: C-020-transport
  required: true
  title: TCP length-prefix protocol
  assertions:
  - 4-byte big-endian frame round-trip works for get_gimp_info.
  - Raw JSON legacy mode is not used in default verification.
  - socket close by client is handled without plug-in crash.
  - invalid command returns status=error.
- id: C-025-async-transport
  required: true
  title: Asyncio-native bridge transport and async MCP tool path
  assertions:
  - AsyncGimpBridge performs a length-prefixed get_gimp_info round-trip.
  - AsyncGimpBridge can register the complete 84-tool MCP surface.
  - Representative image, layer, metadata, and bitmap tools succeed through actual
    async tool handlers.
  - The async bridge closes its stream cleanly after the scenario.
- id: C-030-image-basics
  required: true
  tools:
  - create_image
  - list_images
  - get_image_info
  - duplicate_image
  - flatten_image
  assertions:
  - 320x240 RGB image is created.
  - active image metadata width/height/base_type match request.
  - duplicate creates a second image with same dimensions.
  - flatten succeeds with multiple visible layers.
- id: C-040-layer-contract
  required: true
  title: Layer creation, targeting, alpha and mask lifecycle
  tools:
  - create_layer
  - list_layers
  - set_active_layer
  - set_layer_opacity
  - set_layer_visibility
  - duplicate_layer
  - merge_visible_layers
  - add_alpha_channel
  - add_layer_mask
  - get_layer_mask_info
  - set_layer_mask_state
  - remove_layer_mask
  - delete_layer
  - create_layer_group
  - move_layer_to_group
  - list_channels
  - save_selection_to_channel
  - channel_to_selection
  assertions:
  - layer names, visibility, opacity and alpha state are observable in metadata.
  - active layer selection drives subsequent drawing/filter operations.
  - layer mask add, inspect, edit/show/apply state, and remove paths return structured
    success through the live MCP tool registry.
  - deletion removes only the selected/targeted layer.
- id: C-050-selection-drawing-contract
  required: true
  title: Selection creation, advancement, stroking, bucket fill and drawing
  tools:
  - set_foreground_color
  - set_background_color
  - select_rectangle
  - select_ellipse
  - select_polygon
  - select_all
  - select_none
  - select_invert
  - select_by_color
  - select_grow
  - select_shrink
  - feather_selection
  - border_selection
  - stroke_selection
  - bucket_fill
  - get_selection_info
  - fill_selection
  - draw_line
  - draw_brush_stroke
  - draw_rectangle
  - draw_ellipse
  - draw_polygon
  - add_text
  - edit_clear
  assertions:
  - drawing tools alter bitmap pixels in expected bounding boxes.
  - selection tools create, inspect, grow, shrink, feather, border, stroke, fill,
    and clear current selection state without leaking state after select_none.
  - select_by_color and bucket_fill exercise point-sampled contiguous color workflows
    against an editable drawable.
  - text layer is created with expected text/name and visible pixels.
- id: C-055-path-contract
  required: true
  title: Vector path creation, selection conversion and stroking
  tools:
  - create_path
  - list_paths
  - path_to_selection
  - stroke_path
  - remove_path
  steps:
  - Create a clean image and editable layer.
  - Create a named vector path from control points.
  - Convert the path to a selection, fill it, stroke the path, remove it, and list
    paths.
  assertions:
  - Path tools return structured success results through the MCP tool registry.
  - Path creation/listing/removal is observable through list_paths before and after
    removal.
  - Path-to-selection and stroke_path exercise path, selection, and drawable interaction
    in one live e2e chain.
  - GIMP 3.2.4 path APIs are exercised through Gimp.Path.new, stroke_new_from_points,
    image.select_item and image.remove_path.
- id: C-060-export-bitmap-contract
  required: true
  tools:
  - get_image_bitmap
  - export_image
  assertions:
  - get_image_bitmap returns base64 PNG with PNG magic bytes after decode.
  - max_width/max_height scaling preserves aspect ratio and reports original dimensions.
  - region extraction returns requested dimensions.
  - export_image writes PNG and JPEG through 3.2.4 PDB procedures.
  - temp files are cleaned up after bitmap extraction.
- id: C-070-transform-contract
  required: true
  tools:
  - scale_image
  - scale_layer
  - rotate_image
  - rotate_layer
  - flip_image
  - flip_layer
  - crop_to_selection
  - crop_image
  - autocrop_image
  - resize_canvas
  - offset_layer
  assertions:
  - image/canvas dimensions match expected values after each transform.
  - layer offsets/dimensions are observable after layer transforms.
  - arbitrary layer rotation does not crash and leaves a valid layer.
- id: C-080-color-contract
  required: true
  tools:
  - adjust_brightness_contrast
  - adjust_hue_saturation
  - adjust_levels
  - adjust_curves
  - desaturate
  - invert_colors
  - apply_threshold
  - posterize
  - color_to_alpha
  - auto_white_balance
  - get_colors
  - swap_colors
  - sample_color
  assertions:
  - foreground/background color values round-trip through context state.
  - every color operation returns success and produces measurable pixel delta unless
    input is degenerate.
  - sample_color returns a parseable color at a known painted coordinate.
- id: C-090-filter-contract
  required: true
  tools:
  - apply_gaussian_blur
  - apply_unsharp_mask
  - apply_pixelize
  - apply_edge_detect
  - apply_emboss
  - apply_noise
  - apply_median
  - apply_drop_shadow
  gegl_operations:
  - gegl:gaussian-blur
  - gegl:unsharp-mask
  - gegl:pixelize
  - gegl:edge
  - gegl:edge-laplace
  - gegl:emboss
  - gegl:noise-hsv
  - gegl:median-blur
  assertions:
  - Gimp.DrawableFilter.new exists and accepts each listed GEGL operation where used.
  - filter.get_config exposes all properties being set by the tool.
  - append_filter/merge_filter path succeeds without crashing GIMP 3.2.4.
  - each filter produces a measurable pixel delta or a documented neutral/no-op reason.
  - drop shadow is either supported via script-fu-drop-shadow or returns a structured
    optional-capability error without failing the bridge transport smoke.
- id: C-100-pdb-contract
  required: true
  tools:
  - search_pdb
  - execute_python
  assertions:
  - search_pdb('png') includes file-png-export or an equivalent current 3.2.4 export
    procedure.
  - execute_python can import Gimp/Gegl/Gio/GLib and create/use variables across calls.
  - Python exceptions return structured errors including traceback text.
- id: C-110-history-contract
  required: true
  tools:
  - begin_undo_group
  - end_undo_group
  - undo
  - redo
  assertions:
  - undo group wraps a multi-step draw operation into one undo unit where GIMP exposes
    that behavior.
  - undo and redo alter bitmap/metadata state when GIMP exposes PDB procedures for
    them.
  - if undo/redo PDB procedures are unavailable, the tools return structured optional-capability
    errors without crashing the bridge.
- id: C-120-error-contract
  required: true
  assertions:
  - no-image operations fail cleanly with structured MCP error results.
  - invalid layer name/index fails cleanly with explicit target error.
  - invalid enum string fails before or inside GIMP with actionable message, not silent
    wrong behavior.
  - timeout disconnects bridge and permits later reconnect.
- id: C-130-docs-contract
  required: true
  assertions:
  - README no longer calls GIMP 3.0.8 the current verified release after 3.2.4 certification
    work starts.
  - README has a compatibility table with verified/unverified status and date.
  - setup.sh and README document one canonical plug-in install layout proven by C-010.
  - advertised tool count and section counts match runtime registry.
- id: C-900-stop-bridge
  required: false
  assertions:
  - live smoke can request bridge shutdown after checks so spawned clean-profile GIMP
    processes do not leak.
  - shutdown result is recorded as operational evidence, not as a public compatibility
    claim gate.
static_checks:
- id: S-001-yaml-validity
  required: true
  command: python -c "import yaml; yaml.safe_load(open('compat.yml'))"
  pass_criteria: compat.yml parses without duplicate-key-sensitive parser warnings
    where available.
- id: S-010-tool-registry-count
  required: true
  command: python scripts/project.py list-tools
  fallback_command: python - <<'PY'
  pass_criteria: output total equals mcp_tool_contract.expected_registry_total and
    README count matches.
- id: S-020-unit-suite
  required: true
  command: uv run pytest --no-cov
  pass_criteria: all non-live tests pass.
- id: S-030-quality-gate
  required: true
  command: uv run python scripts/project.py check
  pass_criteria: format-check, lint, typecheck and tests pass.
- id: S-040-doc-claim-gate
  required: true
  command: grep -R "GIMP 3.0.8 compatible" README.md CHANGELOG.md pyproject.toml ||
    true
  pass_criteria: no stale 3.0.8 compatibility claim remains after 3.2.4 verification
    is accepted.
acceptance:
  required_to_close_source_issue:
  - compat.yml exists and is committed.
  - tasks.issues.yml references compat.yml instead of duplicating the detailed checklist.
  - compat.results.yml has at least one passing clean-profile Linux GIMP 3.2.4 run.
  - All required live smoke scenarios pass or have explicit waivers with linked follow-up
    issues.
  - Tool registry count, README count and runtime registration are reconciled.
  - README compatibility table states exact status: verified, partial, or unverified.
  allowed_partial_status: The issue may be marked partial only if GIMP 3.2.4 starts,
    plug-in registration works, transport works, and every remaining failure is tied
    to a concrete API migration or environment follow-up.
  forbidden_acceptance_shortcuts:
  - claiming support based only on import success
  - claiming support based only on pytest without live GIMP
  - ignoring failed tools because execute_python can bypass them
  - using an existing dirty GIMP profile as the only evidence
  - leaving README with stale 3.0.8/current-release wording
