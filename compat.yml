schema: gimp-mcp.compat.v1
project: gimp-mcp
upstream: Hackerobi/gimp-mcp-pro
fork: fkr-0/gimp-mcp
branch: 3.2.4
source_issue: GIMP-MCP-001
created_at: 2026-06-21
status: unverified
contract:
  title: Verify and certify GIMP 3.2.4 compatibility
  scope: Verify that this fork's MCP server, bundled GIMP plug-in, bridge protocol,
    advertised tools, and setup documentation are compatible with GIMP 3.2.4 through
    the GObject-introspection Python interface.
  claim_gate: The project MUST NOT claim verified GIMP 3.2.4 compatibility until every
    required check in this file is passed, or until every non-passing check has an
    explicit waiver with a linked follow-up issue and README caveat.
  result_file: compat.results.yml
  primary_runtime:
    gimp_application_version: 3.2.4
    libgimp_api_namespace: '3.0'
    libgimp_library_version: 3.2.4
    python_binding: PyGObject via gi.repository
    required_imports:
    - import gi
    - gi.require_version('Gimp', '3.0')
    - from gi.repository import Gimp
    - gi.require_version('Gegl', '0.4')
    - from gi.repository import Gegl
    - from gi.repository import GLib
    - from gi.repository import Gio
    optional_imports:
    - gi.require_version('GimpUi', '3.0')
    - from gi.repository import GimpUi
    - from gi.repository import GObject
    - from gi.repository import Gtk
    important_note: GIMP 3.2.4 is verified through the libgimp 3.0 API namespace.
      The code MUST keep gi.require_version('Gimp', '3.0'); there is no separate gi.require_version('Gimp',
      '3.2') contract here.
  evidence_sources:
    official_libgimp_api:
      url: https://developer.gimp.org/api/3.0/libgimp/
      expected_markers:
      - 'API Version: 3.0'
      - 'Library Version: 3.2.4'
      - Gimp.PlugIn
      - Gimp.ImageProcedure
      - Gimp.DrawableFilter
      - Gimp.PDB
      - Gimp.Procedure
    official_python_plugin_tutorial:
      url: https://developer.gimp.org/resource/writing-a-plug-in/tutorial-python/
      expected_markers:
      - gi.require_version('Gimp', '3.0')
      - class HelloWorld (Gimp.PlugIn)
      - do_query_procedures
      - do_create_procedure
      - Gimp.ImageProcedure.new
      - Gimp.main(HelloWorld.__gtype__, sys.argv)
      - plug-ins directory folder/file naming rule
    official_drawable_filter_api:
      url: https://developer.gimp.org/api/3.0/libgimp/class.DrawableFilter.html
      expected_markers:
      - Gimp.DrawableFilter.new
      - get_config
      - update
      - delete
      - set_opacity
      - operation_get_available
      - operation_get_details
      - operation_get_pspecs
    official_pdb_api:
      url: https://developer.gimp.org/api/3.0/libgimp/class.PDB.html
      expected_markers:
      - lookup_procedure
      - procedure_exists
      - query_procedures
    official_procedure_api:
      url: https://developer.gimp.org/api/3.0/libgimp/class.Procedure.html
      expected_markers:
      - create_config
      - run
      - new_return_values
      - add_menu_path
      - set_documentation
      - set_attribution
      - set_menu_label
