      - gimp_port
      - timeout
      - long_timeout
      - max_message_size
      - reconnect_delays
      - log_level
      - debug
      - use_length_prefix
      - plugin_dir

required_artifacts:
  - path: compat.yml
    purpose: normative compatibility contract
    required: true
  - path: compat.results.yml
    purpose: machine-readable result record for one or more live 3.2.4 runs
    required_before_claim: true
  - path: README.md
    purpose: public compatibility claim and setup documentation
    required_before_claim: true
  - path: tests/live_gimp_324_smoke.py
    purpose: optional but recommended executable smoke-test implementation
    required_before_claim: false
  - path: docs/gimp-3.2.4-compat.md
    purpose: optional human-readable runbook/results summary
    required_before_claim: false

compatibility_matrix:
  operating_systems:
    linux:
      required: true
      minimum_expected: one clean Linux desktop/profile run
      plugin_config_root_candidates:
        - '${XDG_CONFIG_HOME:-$HOME/.config}/GIMP/3.0/plug-ins'
    macos:
      required: false
      plugin_config_root_candidates:
        - '$HOME/Library/Application Support/GIMP/3.0/plug-ins'
    windows:
      required: false
      plugin_config_root_candidates:
        - '%APPDATA%/GIMP/3.0/plug-ins'
  gimp_builds:
    flatpak:
      required: false
      notes: Verify actual plug-in path and sandbox networking if this is the local install mode.
    distro_package:
      required: false
      notes: Record package name/version and Python/PyGObject versions.
    source_or_appimage:
      required: false
      notes: Record gimp --version --verbose output if available.
  profiles:
    clean_profile:
      required: true
      requirement: >-
        Use a fresh GIMP user profile with only this plug-in installed, so menu
        registration, PDB discovery, and script-fu dependencies are not hidden
        by existing local state.
    existing_profile:
      required: false
      requirement: Useful as a secondary regression run only.

result_schema:
  compat.results.yml:
    required_top_level_fields:
      - schema
      - project
      - run_id
      - run_started_at
      - run_finished_at
      - tester
      - environment
      - checks
      - summary
    environment_required_fields:
      - os
      - desktop_session
      - gimp_executable
      - gimp_version
      - gimp_verbose_version
      - python_version_inside_gimp
      - pygobject_version_inside_gimp
      - libgimp_api_version
      - libgimp_library_version
      - gegl_version
      - plugin_install_path
      - plugin_sha256
      - mcp_server_revision
      - mcp_server_command
    check_required_fields:
      - id
      - status
      - evidence
    status_values:
      - pass
      - fail
      - skip
      - waived
    waiver_required_fields:
      - reason
      - linked_issue
      - user_visible_caveat

plugin_install_contract:
  id: install
  required: true
  purpose: Ensure GIMP 3.2.4 discovers the plug-in exactly as a normal Python plug-in.
  canonical_layout_options:
    keep_source_filename:
      directory_name: gimp_mcp_plugin
      executable_file: gimp_mcp_plugin.py
      linux_path: '${XDG_CONFIG_HOME:-$HOME/.config}/GIMP/3.0/plug-ins/gimp_mcp_plugin/gimp_mcp_plugin.py'
      rationale: >-
        Official GIMP plug-in file architecture says the plug-in directory and
        Python file stem should match, with .py appended to the file.
    keep_public_bundle_name:
      directory_name: gimp-mcp-pro
      executable_file: gimp-mcp-pro.py
      linux_path: '${XDG_CONFIG_HOME:-$HOME/.config}/GIMP/3.0/plug-ins/gimp-mcp-pro/gimp-mcp-pro.py'
      rationale: >-
        Use this only if setup.sh installs or generates a wrapper/renamed copy
        matching GIMP discovery semantics.
  forbidden_ambiguity:
    - >-
      README/setup MUST NOT document a path whose directory stem and executable
      file stem disagree unless a live GIMP 3.2.4 run proves that specific layout
      is discovered on every claimed OS.
    - >-
      README/setup MUST NOT silently copy gimp_mcp_plugin.py to an extensionless
      file unless that exact extensionless layout is proven discoverable by GIMP
      3.2.4 on the claimed OS.
  permissions:
    linux_macos: executable bit MUST be set on the installed Python plug-in file.
    windows: executable bit is not applicable, but file must be readable by GIMP.
  pass_criteria:
    - GIMP starts with a fresh profile without plug-in load errors.
    - Procedure plug-in-mcp-pro-server is present in the PDB.
    - Menu item appears at Tools -> Start MCP Pro Server.
    - Triggering the menu starts a localhost TCP listener on the configured port.

python_plugin_lifecycle_contract:
  id: lifecycle
  required: true
  required_interfaces:
    - class MUST subclass Gimp.PlugIn.
    - do_query_procedures MUST return ['plug-in-mcp-pro-server'].
    - do_create_procedure MUST return a Gimp.ImageProcedure for plug-in-mcp-pro-server.
    - Gimp.ImageProcedure.new MUST be called with Gimp.PDBProcType.PERSISTENT for the long-lived bridge server procedure.
    - procedure.set_menu_label MUST set Start MCP Pro Server.
    - procedure.set_documentation MUST be populated.
    - procedure.set_attribution MUST be populated.
    - procedure.add_menu_path MUST include '<Image>/Tools/'.
    - run callback MUST accept procedure, run_mode, image, drawables, config, run_data.
    - run callback MUST return procedure.new_return_values with Gimp.PDBStatusType.SUCCESS on clean shutdown/start success.
    - process entrypoint MUST call Gimp.main(MCPProPlugin.__gtype__, sys.argv).
  introspection_probe:
    transport: execute_python pyGObject-eval
    expressions:
      - Gimp.PlugIn is not None
      - Gimp.ImageProcedure is not None
      - Gimp.PDBProcType.PERSISTENT.value_nick if hasattr(Gimp.PDBProcType.PERSISTENT, 'value_nick') else str(Gimp.PDBProcType.PERSISTENT)
      - Gimp.PDBStatusType.SUCCESS is not None
  pass_criteria:
    - All required lifecycle interfaces execute without AttributeError or TypeError under GIMP 3.2.4.
    - No deprecation/migration warning is severe enough to prevent registration or invocation.

bridge_protocol_contract:
  id: bridge-protocol
  required: true
  transport:
    kind: tcp
    host: localhost
    default_port: 9877
    connection_model: persistent
    framing:
      default: length_prefix
      header: 4 byte unsigned big-endian payload length
      payload: UTF-8 JSON object
      max_payload_bytes: 104857600
      legacy_mode: raw JSON boundary detection MAY be supported but MUST NOT be the default for 3.2.4 verification.
  request_schema:
    required_fields:
      id: integer
      type: string
      params: object
    native_command_types:
      - get_image_bitmap
      - get_image_metadata
      - get_gimp_info
      - get_context_state
      - exec
  response_schema:
    success:
      status: success
      results: any
    error:
      status: error
      error: string
      traceback: optional string
  exec_modes:
    pyGObject-console:
      args_shape: ['pyGObject-console', ['python statement', '...']]
      expected_result: list of captured stdout strings
      context_persistence: true
    pyGObject-eval:
      args_shape: ['pyGObject-eval', ['python expression', '...']]
      expected_result: list of stringified expression values
      context_persistence: true
  pass_criteria:
    - Server connects to a live plug-in with default settings.
    - get_gimp_info succeeds on a fresh image-less session.
    - Sequential commands reuse one connection successfully.
    - Invalid command type returns structured status=error without crashing the plug-in.
    - Oversized framed message is rejected without corrupting the next connection.
    - Disconnect/reconnect path succeeds after closing the client socket.

