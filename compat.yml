    - Every symbol used by code or smoke tests exists in GIMP 3.2.4.
    - Every method call used by a tool has a live smoke assertion or a waived follow-up.
    - Any API migration from previous GIMP versions is captured as a code issue, not ignored.

pdb_contract:
  id: pdb
  required: true
  required_procedures:
    - file-png-export
    - file-jpeg-export
    - gimp-image-autocrop
  optional_procedures:
    gimp-image-undo:
      required_for_tool: undo
      pass_policy: >-
        If unavailable in a clean 3.2.4 profile, undo MUST return a structured
        tool error that explains the limitation instead of crashing the bridge.
    gimp-image-redo:
      required_for_tool: redo
      pass_policy: >-
        If unavailable in a clean 3.2.4 profile, redo MUST return a structured
        tool error that explains the limitation instead of crashing the bridge.
  conditional_procedures:
    script-fu-drop-shadow:
      required_for_tool: apply_drop_shadow
      pass_policy: >-
        If unavailable in a clean 3.2.4 profile, apply_drop_shadow MUST either
        be reimplemented with DrawableFilter/GEGL or documented as unavailable
        with a failing/waived compatibility check.
  search_contract:
    tool: search_pdb
    required_behavior:
      - query by substring or regex-like input returns bounded result list.
      - max_results is respected.
      - each result records name and enough metadata to choose a procedure.
  raw_execution_contract:
    tool: execute_python
    required_behavior:
      - statements execute in persistent GIMP context.
      - values/errors are returned in structured MCP result objects.
      - tracebacks are preserved for debugging API migration failures.

