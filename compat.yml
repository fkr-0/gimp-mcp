    menu_label: Start MCP Pro Server
    default_host: localhost
    default_port: 9877
    plugin_env_port: GIMP_MCP_PORT
  server_settings:
    source: src/gimp_mcp_pro/config.py
    primary_prefix: GIMP_MCP_PRO_
    legacy_prefix: GIMP_MCP_
    fields:
