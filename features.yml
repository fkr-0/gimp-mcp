schema_version: 1
project: gimp-mcp-pro
branch: 3.2.4
created_at: 2026-06-21
scope: Future MCP tool features useful for an LLM agent operating GIMP.
status: active-reconciled-2026-06-23
principles:
- Prefer small typed tools over one large execute_python escape hatch.
- Make inspection and reversibility first-class; agents need to see, verify, undo,
  and retry.
- Return compact structured JSON plus optional bounded image payloads; avoid unbounded
  binary transfers.
- Keep destructive operations wrapped in undo groups and explicit transaction IDs.
- Make every live-GIMP feature testable through clean-profile spawned smoke tests
  under Xvfb only.
- Preserve user safety by defaulting to localhost-only bridge access and avoiding
  arbitrary file or shell access.
priority_legend:
  P0: Core agent safety or observability; implement before broad autonomous editing.
  P1: High-value editing workflow support.
  P2: Useful for advanced automation or richer UX.
  P3: Nice-to-have or research-facing feature.
categories:
- id: observe
  title: Visual and document observation
  why: Agents need a compact but reliable view of the current image, layer stack,
    active context, and selected regions before choosing actions.
- id: target
  title: Target resolution and validation
  why: Agents frequently refer to layers, groups, channels, paths, regions, or text
    objects by natural-language descriptions; tools should resolve these safely.
- id: transaction
  title: Reversible edit transactions
  why: Autonomous edits need checkpoints, undo groups, before/after evidence, and
    rollback on failed validation.
- id: edit
  title: Typed editing primitives
  why: Common operations should be exposed as validated tool calls rather than generated
    Python snippets.
- id: verify
  title: Visual verification and regression checks
  why: The agent should assert that a change actually happened and did not damage
    unrelated regions.
- id: asset
  title: Asset, preset, and file workflow
  why: Practical GIMP work involves brushes, palettes, fonts, gradients, templates,
    import/export settings, and sidecar notes.
- id: script
  title: Safe scripting and macro workflows
  why: Some agent workflows need multi-step procedures, but they should be inspectable,
    sandboxed, and replayable.
features:
- id: FEAT-001
  name: observe_document_state
  category: observe
  priority: P0
  summary: Return a complete compact snapshot of the active GIMP document.
  agent_value: Gives the LLM one canonical state object before planning edits.
  proposed_tool_shape:
    input:
      include_thumbnail: boolean
      include_layer_previews: boolean
      max_preview_size: integer
    output:
      image_id: integer
      dimensions: object
      color_mode: string
      active_layer: object
      layer_tree: list
      selections: object
      guides: list
      paths: list
      channels: list
      thumbnail: optional_base64_png
  acceptance:
  - Includes stable layer IDs and names.
  - Bounded thumbnail size is enforced.
  - Works without requiring the active image to be saved to disk.
  status: implemented
  current_tools:
  - observe_document_state
  current_state_note: Current registry exposes document snapshot with bounded thumbnail
    support; layer previews remain warned as follow-up.
  verification:
  - tests/test_tool_generated_code_paths.py::test_all_tools_have_fast_success_path
  - tests/test_tool_invocation_matrix.py::test_all_async_tools_have_offline_success_path
