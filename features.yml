open_design_questions:
- Should raw execute_python be deprecated, hidden behind debug mode, or retained as
  an expert-only emergency tool?
- Should visual observations return base64 payloads directly, temporary resource handles,
  or both?
- How much operation history should be stored in memory, and should it be persisted
  in image metadata?
- Should macro steps use MCP tool names directly or a smaller stable internal operation
  DSL?
- Which export paths should be considered safe for automated agents, especially under
  Flatpak sandboxing?
- How should live smoke tests distinguish optional GIMP plug-ins from required core
  functionality?
